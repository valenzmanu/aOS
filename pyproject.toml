[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aos-control-plane"
version = "0.1.0"
description = "A harness-agnostic, durable control plane for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Manuel Valenzuela" }]
keywords = ["agents", "codex", "cursor", "orchestration", "control-plane"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
cursor = ["cursor-sdk>=1.0.24,<1.1"]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
aos = "aos.cli:main"
aosd = "aos.daemon:main"

[project.urls]
Homepage = "https://github.com/valenzmanu/aOS"
Issues = "https://github.com/valenzmanu/aOS/issues"

[tool.hatch.build.targets.wheel]
packages = ["aos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
