[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aos-agent-os"
version = "0.2.0"
description = "A sparse constitutional substrate for agent-run missions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Manuel Valenzuela" }]
keywords = ["agents", "codex", "constitution", "journal", "state-tree"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
aos-v0 = "modules.v0_tracer:main"

[project.urls]
Homepage = "https://github.com/valenzmanu/aOS"
Issues = "https://github.com/valenzmanu/aOS/issues"

[tool.hatch.build.targets.wheel]
packages = ["modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
